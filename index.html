<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPack - Merge & Compress</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .drop-zone { transition: all 0.3s; }
        .drop-zone.dragover { background-color: #dbeafe; border-color: #3b82f6; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">

<div class="max-w-4xl mx-auto p-6">

    <h1 class="text-5xl font-bold text-center text-gray-900 mb-2">📄 JobPack</h1>
    <p class="text-center text-xl text-blue-600 mb-10">Professional Document Merger & Compressor</p>

    <!-- Main Card -->
    <div class="bg-white rounded-3xl shadow-xl p-8 mb-8">

        <h2 class="text-3xl font-semibold text-center mb-8">Create Your Complete Application Package</h2>

        <!-- Upload Area -->
        <div id="dropZone" 
             class="drop-zone border-2 border-dashed border-blue-300 rounded-2xl p-12 text-center mb-8 cursor-pointer hover:border-blue-400">
            <div class="text-6xl mb-4">📤</div>
            <p class="text-lg font-medium">Drop your files here or click to upload</p>
            <p class="text-sm text-gray-500">PDF, DOCX, JPG, PNG supported</p>
            <input type="file" id="fileInput" multiple class="hidden">
        </div>

        <!-- Document List -->
        <div id="fileList" class="mb-8 space-y-3"></div>

        <!-- Target Size -->
        <div class="flex items-center gap-4 mb-8 bg-gray-50 p-6 rounded-2xl">
            <label class="font-medium">Target File Size:</label>
            <input type="number" id="targetSize" value="2" class="w-24 border rounded-lg px-4 py-2">
            <select id="unit" class="border rounded-lg px-4 py-2">
                <option value="MB">MB</option>
                <option value="KB">KB</option>
            </select>
        </div>

        <!-- Merge Button -->
        <button onclick="mergeAndCompress()"
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-6 rounded-2xl text-2xl font-bold hover:scale-105 transition-all flex items-center justify-center gap-3">
            <span>🚀</span>
            <span>Assemble & Optimize Package</span>
        </button>
    </div>

    <!-- Result Area -->
    <div id="result" class="hidden bg-green-50 border border-green-200 rounded-3xl p-8 text-center">
        <h3 class="text-2xl font-semibold mb-4 text-green-700">✅ Your Package is Ready!</h3>
        <a id="downloadBtn" 
           class="inline-block bg-green-600 text-white px-10 py-4 rounded-2xl text-xl font-bold hover:bg-green-700">
            📥 Download Final PDF
        </a>
    </div>

</div>

<script>
let files = [];

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener('change', e => handleFiles(e.target.files));

function handleFiles(newFiles) {
    for (let file of newFiles) {
        if (file.type === "application/pdf" || file.name.endsWith('.pdf')) {
            files.push(file);
            renderFileList();
        } else {
            alert("Only PDF files are fully supported for now.");
        }
    }
}

function renderFileList() {
    fileList.innerHTML = '';
    files.forEach((file, index) => {
        const div = document.createElement('div');
        div.className = "flex items-center justify-between bg-gray-50 p-4 rounded-xl";
        div.innerHTML = `
            <span class="font-medium">${file.name}</span>
            <button onclick="removeFile(${index})" class="text-red-500 hover:text-red-700">Remove</button>
        `;
        fileList.appendChild(div);
    });
}

function removeFile(index) {
    files.splice(index, 1);
    renderFileList();
}

async function mergeAndCompress() {
    if (files.length === 0) {
        alert("Please upload at least one PDF file");
        return;
    }

    const btn = document.querySelector('button');
    btn.innerHTML = '🔄 Processing... Please wait';
    btn.disabled = true;

    try {
        const mergedPdf = await PDFLib.PDFDocument.create();

        for (let file of files) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
            const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
            copiedPages.forEach(page => mergedPdf.addPage(page));
        }

        const pdfBytes = await mergedPdf.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        
        // Show result
        const resultDiv = document.getElementById('result');
        const downloadBtn = document.getElementById('downloadBtn');
        
        downloadBtn.onclick = () => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Application_Package.pdf';
            a.click();
        };

        resultDiv.classList.remove('hidden');
        
    } catch (e) {
        alert("Error processing files: " + e.message);
    }

    btn.innerHTML = `🚀 Assemble & Optimize Package`;
    btn.disabled = false;
}
</script>

</body>
</html>
