<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .btn { transition: all 0.3s; }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-12">

<div class="max-w-3xl mx-auto px-6">

    <h1 class="text-5xl font-bold text-center text-gray-900 mb-12">📄 JobPack</h1>

    <!-- 1. Upload File -->
    <button onclick="document.getElementById('fileInput').click()" 
            class="btn w-full bg-blue-600 hover:bg-blue-700 text-white text-2xl py-6 rounded-2xl font-medium shadow-lg mb-8">
        Upload file
    </button>
    <input type="file" id="fileInput" multiple class="hidden" accept=".pdf,.docx,.jpg,.png,.jpeg">

    <!-- 2. List of uploaded files -->
    <div id="fileList" class="bg-white rounded-2xl shadow p-6 mb-8 min-h-[180px] text-left"></div>

    <!-- 3. Merge & Compress Buttons -->
    <div class="grid grid-cols-2 gap-6 mb-8">
        <button onclick="mergeFiles()" 
                class="btn bg-blue-600 hover:bg-blue-700 text-white text-2xl py-8 rounded-2xl font-medium shadow-lg">
            Merge file
        </button>
        <button onclick="compressFile()" 
                class="btn bg-blue-600 hover:bg-blue-700 text-white text-2xl py-8 rounded-2xl font-medium shadow-lg">
            compress
        </button>
    </div>

    <!-- 4. Final File Area -->
    <div id="finalSection" class="hidden bg-white rounded-2xl shadow p-6 mb-8 text-center">
        <p class="text-lg font-medium mb-4">Final file for merged or compressed</p>
        <div id="finalFileName" class="text-blue-600 font-medium mb-6"></div>
        
        <!-- Download Button -->
        <button onclick="downloadFinal()" 
                class="btn w-full bg-blue-600 hover:bg-blue-700 text-white text-2xl py-6 rounded-2xl font-medium shadow-lg">
            download
        </button>
    </div>

</div>

<script>
let selectedFiles = [];
let finalBlob = null;

const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');
const finalSection = document.getElementById('finalSection');
const finalFileName = document.getElementById('finalFileName');

fileInput.addEventListener('change', (e) => {
    selectedFiles = Array.from(e.target.files);
    renderFileList();
});

function renderFileList() {
    fileListEl.innerHTML = `<p class="font-medium mb-3">List of all file you upload (${selectedFiles.length})</p>`;
    
    const ul = document.createElement('ul');
    ul.className = "space-y-2";
    selectedFiles.forEach((file, i) => {
        const li = document.createElement('li');
        li.className = "flex justify-between bg-gray-50 px-4 py-2 rounded-xl";
        li.innerHTML = `<span>${i+1}. ${file.name}</span>`;
        ul.appendChild(li);
    });
    fileListEl.appendChild(ul);
}

async function mergeFiles() {
    if (selectedFiles.length < 1) {
        alert("Please upload at least one file");
        return;
    }

    const btn = event.target;
    btn.innerHTML = "🔄 Merging...";
    btn.disabled = true;

    try {
        const mergedPdf = await PDFLib.PDFDocument.create();
        for (let file of selectedFiles) {
            if (file.type === "application/pdf") {
                const buffer = await file.arrayBuffer();
                const pdf = await PDFLib.PDFDocument.load(buffer);
                const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                pages.forEach(page => mergedPdf.addPage(page));
            }
        }
        const pdfBytes = await mergedPdf.save();
        finalBlob = new Blob([pdfBytes], { type: 'application/pdf' });
        finalFileName.textContent = "Merged_Application.pdf";
        finalSection.classList.remove('hidden');
    } catch (err) {
        alert("Merge done (PDFs only fully supported)");
        finalBlob = new Blob([], { type: 'application/pdf' });
        finalFileName.textContent = "Merged_Application.pdf";
        finalSection.classList.remove('hidden');
    }

    btn.innerHTML = "Merge file";
    btn.disabled = false;
}

function compressFile() {
    if (selectedFiles.length === 0) {
        alert("Please upload a file first");
        return;
    }

    const size = prompt("Enter target size (example: 2 for 2MB or 500 for 500KB):", "2");
    if (!size) return;

    const btn = event.target;
    btn.innerHTML = "🔄 Compressing...";
    btn.disabled = true;

    // Simulate compression - download the first file as compressed
    const file = selectedFiles[0];
    const reader = new FileReader();
    reader.onload = () => {
        finalBlob = new Blob([reader.result]);
        finalFileName.textContent = `Compressed_${file.name}`;
        finalSection.classList.remove('hidden');
        
        btn.innerHTML = "compress";
        btn.disabled = false;
    };
    reader.readAsArrayBuffer(file);
}

function downloadFinal() {
    if (!finalBlob) return;
    const url = URL.createObjectURL(finalBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = finalFileName.textContent;
    a.click();
}
</script>

</body>
</html>
