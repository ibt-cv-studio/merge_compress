<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobPack - PDF Merger</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
body{
    font-family:system-ui,sans-serif;
}

.drop-zone{
    transition:all .3s ease;
}

.drop-zone.dragover{
    background:#dbeafe;
    border-color:#2563eb;
}

.card{
    animation:fadeIn .4s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">

<div class="max-w-5xl mx-auto p-6">

    <div class="text-center mb-10">
        <h1 class="text-5xl font-bold text-gray-900">
            📄 JobPack
        </h1>

        <p class="text-xl text-blue-600 mt-2">
            Professional Application Package Builder
        </p>

        <p class="text-gray-500 mt-2">
            Merge CV, Cover Letter, Certificates and other PDF documents
        </p>
    </div>

    <div class="bg-white rounded-3xl shadow-xl p-8">

        <div
            id="dropZone"
            class="drop-zone border-2 border-dashed border-blue-300 rounded-2xl p-12 text-center cursor-pointer">

            <div class="text-6xl mb-4">
                📤
            </div>

            <h2 class="text-2xl font-semibold">
                Upload PDF Files
            </h2>

            <p class="text-gray-500 mt-2">
                Click or Drag & Drop PDFs Here
            </p>

            <input
                type="file"
                id="fileInput"
                multiple
                accept=".pdf"
                class="hidden">
        </div>

        <div id="fileList" class="mt-8 space-y-3"></div>

        <div class="mt-8">
            <button
                id="mergeBtn"
                onclick="mergePDFs()"
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-5 rounded-2xl text-xl font-bold hover:opacity-90">

                🚀 Merge Documents
            </button>
        </div>

    </div>

    <div
        id="result"
        class="hidden mt-8 bg-green-50 border border-green-200 rounded-2xl p-8 text-center">

        <h3 class="text-2xl font-bold text-green-700 mb-4">
            ✅ PDF Ready
        </h3>

        <p class="text-gray-600 mb-6">
            Your merged application package is ready.
        </p>

        <a
            id="downloadBtn"
            class="inline-block bg-green-600 text-white px-8 py-4 rounded-xl font-bold hover:bg-green-700">
            📥 Download PDF
        </a>
    </div>

</div>

<script>

let files = [];

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const fileList = document.getElementById("fileList");

dropZone.addEventListener("click", () => {
    fileInput.click();
});

dropZone.addEventListener("dragover", e => {
    e.preventDefault();
    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener("change", e => {
    handleFiles(e.target.files);
});

function handleFiles(newFiles){

    for(let file of newFiles){

        if(file.type === "application/pdf"){
            files.push(file);
        }
        else{
            alert("Only PDF files are supported.");
        }
    }

    renderFiles();
}

function formatSize(bytes){

    let kb = bytes / 1024;
    let mb = kb / 1024;

    if(mb >= 1){
        return mb.toFixed(2) + " MB";
    }

    return kb.toFixed(2) + " KB";
}

function renderFiles(){

    fileList.innerHTML = "";

    if(files.length === 0){
        return;
    }

    let totalSize = 0;

    files.forEach((file,index)=>{

        totalSize += file.size;

        const div = document.createElement("div");

        div.className =
        "card bg-gray-50 border rounded-xl p-4 flex justify-between items-center";

        div.innerHTML = `
        <div>
            <div class="font-medium">${file.name}</div>
            <div class="text-sm text-gray-500">
                ${formatSize(file.size)}
            </div>
        </div>

        <div class="flex gap-2">

            <button
                onclick="moveUp(${index})"
                class="bg-blue-100 px-3 py-1 rounded">
                ↑
            </button>

            <button
                onclick="moveDown(${index})"
                class="bg-blue-100 px-3 py-1 rounded">
                ↓
            </button>

            <button
                onclick="removeFile(${index})"
                class="bg-red-100 text-red-600 px-3 py-1 rounded">
                Remove
            </button>

        </div>
        `;

        fileList.appendChild(div);
    });

    const summary = document.createElement("div");

    summary.className =
    "bg-blue-50 border border-blue-200 p-4 rounded-xl";

    summary.innerHTML = `
        <strong>Total Files:</strong> ${files.length}
        <br>
        <strong>Total Size:</strong> ${formatSize(totalSize)}
    `;

    fileList.appendChild(summary);
}

function moveUp(index){

    if(index === 0) return;

    [files[index],files[index-1]]
    =
    [files[index-1],files[index]];

    renderFiles();
}

function moveDown(index){

    if(index === files.length-1) return;

    [files[index],files[index+1]]
    =
    [files[index+1],files[index]];

    renderFiles();
}

function removeFile(index){

    files.splice(index,1);

    renderFiles();
}

async function mergePDFs(){

    if(files.length === 0){

        alert("Please upload at least one PDF.");

        return;
    }

    const btn = document.getElementById("mergeBtn");

    btn.disabled = true;
    btn.innerHTML = "🔄 Merging PDFs...";

    try{

        const mergedPdf =
        await PDFLib.PDFDocument.create();

        for(const file of files){

            const bytes =
            await file.arrayBuffer();

            const pdf =
            await PDFLib.PDFDocument.load(bytes);

            const pages =
            await mergedPdf.copyPages(
                pdf,
                pdf.getPageIndices()
            );

            pages.forEach(page =>
                mergedPdf.addPage(page)
            );
        }

        const mergedBytes =
        await mergedPdf.save();

        const blob =
        new Blob(
            [mergedBytes],
            {type:"application/pdf"}
        );

        const url =
        URL.createObjectURL(blob);

        const downloadBtn =
        document.getElementById("downloadBtn");

        downloadBtn.href = url;
        downloadBtn.download =
        "Application_Package.pdf";

        document
        .getElementById("result")
        .classList
        .remove("hidden");

    }
    catch(error){

        alert(
            "Error merging PDFs:\n" +
            error.message
        );
    }

    btn.disabled = false;
    btn.innerHTML =
    "🚀 Merge Documents";
}

</script>

</body>
</html>
