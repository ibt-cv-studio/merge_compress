<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobPack Pro</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
body{
    font-family:Segoe UI,sans-serif;
    background:linear-gradient(135deg,#eff6ff,#dbeafe,#eef2ff);
    min-height:100vh;
}

.card{
    background:white;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.drop-zone{
    border:3px dashed #93c5fd;
    border-radius:24px;
    padding:50px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
}

.drop-zone:hover{
    background:#eff6ff;
    border-color:#2563eb;
}

.file-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:14px;
    margin-bottom:10px;
}

.btn{
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.hidden{
    display:none;
}
</style>
</head>

<body class="p-6">

<div class="max-w-5xl mx-auto">

    <h1 class="text-6xl font-bold text-center mb-2">
        📄 JobPack Pro
    </h1>

    <p class="text-center text-blue-600 text-xl mb-8">
        Merge • Compress • Organize Documents
    </p>

    <div class="grid grid-cols-2 gap-4 mb-6">

        <div class="card p-6 text-center">
            <div id="fileCount"
                 class="text-4xl font-bold text-blue-600">
                 0
            </div>

            <div>Total Files</div>
        </div>

        <div class="card p-6 text-center">
            <div id="totalSize"
                 class="text-4xl font-bold text-green-600">
                 0 MB
            </div>

            <div>Total Size</div>
        </div>

    </div>

    <div id="dropZone" class="drop-zone card">

        <div class="text-6xl mb-4">
            📤
        </div>

        <h2 class="text-3xl font-bold">
            Upload PDF Documents
        </h2>

        <p class="text-gray-500 mt-2">
            Click or Drag & Drop PDF files
        </p>

        <input
            type="file"
            id="fileInput"
            accept=".pdf"
            multiple
            hidden>

    </div>

    <div id="fileList"
         class="card p-6 mt-6">

        <p class="text-center text-gray-500">
            No files uploaded
        </p>

    </div>

    <div class="grid grid-cols-2 gap-4 mt-6">

        <button
            id="mergeBtn"
            class="btn bg-blue-600 text-white p-5 rounded-2xl text-xl font-bold">

            🔗 Merge Files

        </button>

        <button
            id="compressBtn"
            class="btn bg-purple-600 text-white p-5 rounded-2xl text-xl font-bold">

            📦 Compress PDF

        </button>

    </div>

    <div id="result"
         class="hidden card p-6 mt-6 text-center">

        <h2 class="text-3xl font-bold text-green-600 mb-3">
            ✅ Ready
        </h2>

        <p id="resultName"
           class="mb-4">
        </p>

        <div id="resultInfo"
             class="mb-4">
        </div>

        <button
            id="downloadBtn"
            class="bg-green-600 text-white px-8 py-4 rounded-xl font-bold">

            📥 Download

        </button>

    </div>

</div>

<script>

let files = [];
let finalBlob = null;

const fileInput =
document.getElementById("fileInput");

const dropZone =
document.getElementById("dropZone");

dropZone.onclick = () => {
    fileInput.click();
};

fileInput.addEventListener(
"change",
e => handleFiles(e.target.files)
);

dropZone.addEventListener(
"dragover",
e => {
    e.preventDefault();
}
);

dropZone.addEventListener(
"drop",
e => {

    e.preventDefault();

    handleFiles(
        e.dataTransfer.files
    );
}
);

function handleFiles(newFiles){

    for(let file of newFiles){

        if(file.type === "application/pdf"){

            files.push(file);
        }
    }

    renderFiles();
}

function formatSize(bytes){

    let mb = bytes / 1024 / 1024;

    if(mb < 1){

        return (
            bytes / 1024
        ).toFixed(2) + " KB";
    }

    return mb.toFixed(2) + " MB";
}

function renderFiles(){

    const list =
    document.getElementById("fileList");

    if(files.length === 0){

        list.innerHTML =
        "<p class='text-center text-gray-500'>No files uploaded</p>";

        return;
    }

    let total = 0;

    list.innerHTML = "";

    files.forEach((file,index)=>{

        total += file.size;

        const div =
        document.createElement("div");

        div.className =
        "file-item";

        div.innerHTML =
        `
        <div>
            <strong>${file.name}</strong>
            <br>
            <small>
                ${formatSize(file.size)}
            </small>
        </div>

        <button
            onclick="removeFile(${index})"
            class="bg-red-500 text-white px-3 py-2 rounded-lg">

            Remove

        </button>
        `;

        list.appendChild(div);
    });

    document.getElementById(
        "fileCount"
    ).innerText =
    files.length;

    document.getElementById(
        "totalSize"
    ).innerText =
    formatSize(total);
}

function removeFile(index){

    files.splice(index,1);

    renderFiles();
}

document.getElementById(
"mergeBtn"
).onclick =
async function(){

    if(files.length === 0){

        alert(
            "Upload PDFs first"
        );

        return;
    }

    const merged =
    await PDFLib.PDFDocument.create();

    for(const file of files){

        const bytes =
        await file.arrayBuffer();

        const pdf =
        await PDFLib.PDFDocument.load(
            bytes
        );

        const pages =
        await merged.copyPages(
            pdf,
            pdf.getPageIndices()
        );

        pages.forEach(page =>
            merged.addPage(page)
        );
    }

    const mergedBytes =
    await merged.save();

    finalBlob =
    new Blob(
        [mergedBytes],
        {
            type:"application/pdf"
        }
    );

    showResult(
        "Merged_Application.pdf",
        "Files merged successfully."
    );
};

document.getElementById(
"compressBtn"
).onclick =
async function(){

    if(files.length === 0){

        alert(
            "Upload a PDF first"
        );

        return;
    }

    const file =
    files[0];

    const originalSize =
    file.size;

    const pdf =
    await PDFLib.PDFDocument.load(
        await file.arrayBuffer()
    );

    pdf.setTitle("");
    pdf.setAuthor("");
    pdf.setProducer("");

    const bytes =
    await pdf.save({
        useObjectStreams:true
    });

    finalBlob =
    new Blob(
        [bytes],
        {
            type:"application/pdf"
        }
    );

    const reduction =
    (
        (
            originalSize -
            finalBlob.size
        )
        /
        originalSize
    ) * 100;

    showResult(
        "Compressed.pdf",
        `
        Original:
        ${formatSize(originalSize)}
        <br>

        New:
        ${formatSize(finalBlob.size)}
        <br>

        Reduction:
        ${reduction.toFixed(1)}%
        `
    );
};

function showResult(
    filename,
    info
){

    document.getElementById(
        "result"
    ).classList.remove(
        "hidden"
    );

    document.getElementById(
        "resultName"
    ).innerText =
    filename;

    document.getElementById(
        "resultInfo"
    ).innerHTML =
    info;
}

document.getElementById(
"downloadBtn"
).onclick =
function(){

    if(!finalBlob) return;

    const url =
    URL.createObjectURL(
        finalBlob
    );

    const a =
    document.createElement(
        "a"
    );

    a.href = url;

    a.download =
    document.getElementById(
        "resultName"
    ).innerText;

    a.click();

    URL.revokeObjectURL(
        url
    );
};

</script>

</body>
</html>
